<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <link rel="script" href="script/script.js">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"> <!-- Bootstrap CSS -->
    <title>Spoti'stat</title>
  </head>
  <body>

    <header class="text-bg-primary p-3">
      <h1>Mes Musiques</h1>
      (The Living Tombsone addict [oui])
    </header>
<br>
  
  <div class="container text-center">
    <div x-data="{ tracks: [] }"  x-init="tracks = await chargerTracks()">
  <!-- tracks est rempli, Alpine met à jour l'affichage automatiquement -->
      <template x-for="track in tracks">
        <div>
          <h3 x-text="track.name"></h3>
          <p x-text="track.artists[0].name"></p>
          <p x-text="track.album.name"></p>
        </div>
      </template>

    </div>

  </div>



    <footer class="text-bg-primary p-3 text-center">
      <p>2026 Spoti'stat. Tous droits réservés.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script> <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- Chart.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script> <!-- Alpine.js -->
    <script src="script/script.js"></script>
  </body>
</html>
